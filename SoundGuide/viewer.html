<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundGuide 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8e8e8; overflow: hidden;
               font: 15px Hacked, ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .08em; }
  @font-face { font-family: Hacked; src: url(/hacked.ttf) format("truetype"); font-display: swap; }
  /* Heading-up minimap, like the app's Map view. */
  #mini { position: fixed; right: 16px; top: 16px; z-index: 1; width: min(240px, 38vw); aspect-ratio: 1; padding: 0;
          background: rgba(0,0,0,.6); border-left: 2px solid #fff; }
  /* Scanlines and a vignette over the canvas. */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
                background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
                            radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%); }
  /* Controls top left, the Ask conversation bottom left; a long answer scrolls instead of growing over the controls. */
  #side { position: fixed; left: 16px; top: 16px; bottom: 16px; z-index: 1; display: flex; flex-direction: column;
          justify-content: space-between; align-items: flex-start; gap: 16px; pointer-events: none; }
  .panel { padding: 10px 14px; background: rgba(0,0,0,.55); border-left: 2px solid #fff; pointer-events: auto; }
  #hud { flex: none; }
  #hud b { display: block; font-size: 22px; letter-spacing: .12em; }
  #hud b::after { content: "_"; animation: blink 1s steps(1) infinite; }
  #hud label { display: block; margin-top: 6px; color: #9a9a9a; cursor: pointer; }
  #hud select { background: #000; color: #fff; border: 1px solid #9a9a9a; padding: 2px 4px;
                font: inherit; text-transform: inherit; letter-spacing: inherit; }
  #hud button { display: block; margin-top: 8px; padding: 4px 10px; background: none; color: #fff; border: 1px solid #fff;
                font: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; }
  #hud button:hover, #hud button:focus-visible { background: #fff; color: #000; }
  #hud button[aria-pressed="false"] { color: #9a9a9a; border-color: #9a9a9a; }
  #status { color: #5fd4ff; }
  #ask { margin-top: auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; max-width: min(420px, 80vw); text-transform: none; letter-spacing: 0; font: 14px/1.45 ui-monospace, Menlo, monospace; }
  #ask[hidden] { display: none; }
  #ask b { display: block; color: #5fd4ff; font: 13px Hacked, ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
  #ask p { margin: 6px 0 0; color: #fff; }
  #ask p + p { color: #cfcfcf; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #hud b::after { animation: none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="side">
<div id="hud" class="panel"><b>Live feed</b><span id="status" role="status">Connecting…</span><label>Camera <select id="view">
  <option value="free">Free</option>
  <option value="follow">Follow</option>
  <option value="chase" selected>Third person</option>
</select></label><button id="labels" aria-pressed="false">Labels: off</button><button id="beeps" aria-pressed="false">Sound: off</button></div>
<div id="ask" class="panel" aria-live="polite" hidden><b id="ask-state"></b><p id="ask-q"></p><p id="ask-a"></p></div>
</div>
<canvas id="mini" aria-hidden="true"></canvas>
<!-- Font: HACKED by David Libeau, http://bit.ly/WatchDogsFont (CC-BY credit; see LICENSES/HACKED-font.md) -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MAX_TRAIL = 5000, POLL_MS = 100, TILE_M = 0.5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
camera.position.set(0, 3, 4);
const controls = new OrbitControls(camera, renderer.domElement);
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// Tiled floor at the height the app found. One canvas tile, repeated; the bevel fakes depth without lights.
const tile = document.createElement('canvas');
tile.width = tile.height = 128;
{
  const g = tile.getContext('2d');
  g.fillStyle = '#0d0d0d'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#1c1c1c'; g.fillRect(0, 0, 128, 3); g.fillRect(0, 0, 3, 128);       // lit top-left edge
  g.fillStyle = '#050505'; g.fillRect(0, 125, 128, 3); g.fillRect(125, 0, 3, 128);   // shaded bottom-right edge
  g.strokeStyle = '#2e2e2e'; g.lineWidth = 2; g.strokeRect(0, 0, 128, 128);          // grout
}
const floorTex = new THREE.CanvasTexture(tile);
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
floorTex.colorSpace = THREE.SRGBColorSpace;
const FLOOR_M = 40;
floorTex.repeat.set(FLOOR_M / TILE_M, FLOOR_M / TILE_M);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_M, FLOOR_M).rotateX(-Math.PI / 2),
                             new THREE.MeshBasicMaterial({ map: floorTex }));
floor.position.y = -0.001;   // just under the trail and box bottoms
scene.add(floor);

// Cone tip along +z, which is the axis Object3D.lookAt aims at the target.
const phone = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.25, 16).rotateX(Math.PI / 2),
                             new THREE.MeshBasicMaterial({ color: 0x5fd4ff, wireframe: true }));
scene.add(phone);

const trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x5fd4ff, transparent: true, opacity: 0.6 }));
trail.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_TRAIL * 3), 3));
trail.geometry.setDrawRange(0, 0);
trail.frustumCulled = false;
scene.add(trail);
let trailCount = 0;
const lastTrail = new THREE.Vector3(Infinity, 0, 0);

const unitEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
const leaderGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 1, 0)]);
const boxes = new Map();   // track id -> { box, tag, leader }
const name = o => `${o.label}_${String(o.id).padStart(2, '0')}`;

function makeTag(text) {
  const font = '34px Hacked, ui-monospace, Menlo, Consolas, monospace';
  const canvas = document.createElement('canvas');
  let g = canvas.getContext('2d');
  g.font = font;
  canvas.width = Math.ceil(g.measureText(text).width) + 28;   // resizing resets the context
  canvas.height = 48;
  g = canvas.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, canvas.width, 48);
  g.font = font;
  g.textBaseline = 'middle';
  g.fillStyle = '#000';
  g.fillText(text, 14, 25);
  // Constant size on screen, so far-away tags stay readable.
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false, sizeAttenuation: false }));
  tag.center.set(0, 0);   // anchor the plate's bottom-left corner on top of the leader line
  tag.scale.set(0.03 * canvas.width / 48, 0.03, 1);
  return tag;
}

let showLabels = false;
const labelsButton = document.getElementById('labels');
labelsButton.onclick = () => {
  showLabels = !showLabels;
  labelsButton.setAttribute('aria-pressed', showLabels);
  labelsButton.textContent = `Labels: ${showLabels ? 'on' : 'off'}`;
  for (const b of boxes.values()) b.tag.visible = b.leader.visible = showLabels;
};

// The app's proximity beep (ProximityBeepTiming + SpatialAudio.proximityTone: 520 Hz, 65 ms), a poll (~100 ms) late.
// Off by default; the click also unlocks browser audio. No buzz: with the phone also playing, it sounded doubled.
let audio = null, range = null, lastBeep = -Infinity;
const beepsButton = document.getElementById('beeps');
beepsButton.onclick = () => {
  audio = audio ? (audio.close(), null) : new AudioContext();
  lastBeep = -Infinity;   // each AudioContext's clock starts at 0
  if (audio) {
    audio.resume();
    speechSynthesis.speak(new SpeechSynthesisUtterance(''));   // Safari only lets speech start from a click
    beep(audio.currentTime + 0.05);   // confirms sound works; the phone may well be silent right now
  }
  beepsButton.setAttribute('aria-pressed', !!audio);
  beepsButton.textContent = `Sound: ${audio ? 'on' : 'off'}`;
  if (!audio) speechSynthesis.cancel();
};
function beep(t) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 520;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.6, t + 0.005);
  g.gain.setValueAtTime(0.6, t + 0.06);
  g.gain.linearRampToValueAtTime(0, t + 0.065);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + 0.07);
}
function beepTick() {
  try { soundTick(); } finally { setTimeout(beepTick, 20); }   // one bad frame must not stop the loop for good
}
function soundTick() {
  if (audio && range > 0 && range <= 2) {
    const interval = range <= 0.65 ? 0.2 : range <= 1.2 ? 0.45 : 0.85, t = audio.currentTime;
    if (t - lastBeep >= interval) { lastBeep = t; beep(t); }
  }
}
beepTick();

// Snapshots arrive at 10 Hz. They only set goals; every rendered frame eases towards them.
const SMOOTH_S = 0.15;   // time constant: smaller is snappier, larger is smoother but further behind
const goalPos = new THREE.Vector3(), goalQuat = new THREE.Quaternion(), aim = new THREE.Object3D();

// Third person: the camera sits behind and above the phone and turns with it.
const CHASE_BACK = 2.5, CHASE_UP = 1.3, CHASE_AHEAD = 1.5, CHASE_TURN_S = 0.4;   // metres; turn easing is slower than SMOOTH_S so the view doesn't whip round
// Third person only: boxes inside the phone camera's view are solid, the rest fade.
const CONE_HALF = 35 * Math.PI / 180, FADED = 0.15;   // ponytail: roughly half the phone camera's horizontal FOV; ignores pitch
const view = document.getElementById('view');
let goalHeading = null, heading = 0;   // radians about +y; (sin, cos) is the horizontal facing direction
view.onchange = () => {
  controls.enabled = view.value !== 'chase';
  if (view.value === 'chase') { if (goalHeading != null) heading = goalHeading; }
  else controls.target.copy(phone.position);   // orbit around the phone again
};
// ?view=chase opens straight into a mode.
const wanted = new URLSearchParams(location.search).get('view');
if ([...view.options].some(o => o.value === wanted)) view.value = wanted;
view.onchange();   // the default (third person) also needs orbit controls off
let started = false;
function apply(s) {
  if (!s.cam) return;   // the app has not published a frame yet
  const p = new THREE.Vector3(...s.cam);
  aim.position.copy(p);
  aim.lookAt(p.clone().add(new THREE.Vector3(...s.fwd)));
  goalPos.copy(p);
  goalQuat.copy(aim.quaternion);
  // A phone pointing at the floor or ceiling has no heading; keep the last one.
  if (Math.hypot(s.fwd[0], s.fwd[2]) > 0.3) goalHeading = Math.atan2(s.fwd[0], s.fwd[2]);
  if (!started) {
    started = true;
    phone.position.copy(p);
    phone.quaternion.copy(goalQuat);
    const delta = p.clone().sub(controls.target);
    camera.position.add(delta);
    controls.target.add(delta);
  }

  floor.visible = s.floorY != null;   // y = 0 is the phone's start height, not the floor
  if (floor.visible) floor.position.y = s.floorY - 0.001;
  // Keep the floor under the walker, snapped to whole tiles so the pattern stays put in the world.
  floor.position.x = Math.round(p.x / TILE_M) * TILE_M;
  floor.position.z = Math.round(p.z / TILE_M) * TILE_M;

  const seen = new Set();
  for (const o of s.objects) {
    seen.add(o.id);
    let b = boxes.get(o.id);
    if (!b) {
      const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true });   // per box: each fades on its own
      b = { box: new THREE.LineSegments(unitEdges, mat), tag: makeTag(name(o).toUpperCase()), mat, opacity: 1,
            leader: new THREE.Line(leaderGeometry, mat), pos: new THREE.Vector3(), scale: new THREE.Vector3(), yaw: 0, fresh: true };
      b.leader.scale.y = 0.25;
      b.tag.visible = b.leader.visible = showLabels;
      scene.add(b.box, b.tag, b.leader);
      boxes.set(o.id, b);
    }
    const [lo, hi] = o.y;
    b.pos.set(o.c[0], (lo + hi) / 2, o.c[1]);
    b.scale.set(o.half[0] * 2, hi - lo, o.half[1] * 2);
    b.yaw = o.yaw;
  }
  for (const [id, b] of boxes) {
    if (seen.has(id)) continue;
    scene.remove(b.box, b.tag, b.leader);
    b.tag.material.map.dispose();
    b.tag.material.dispose();
    b.mat.dispose();
    boxes.delete(id);
  }

  const count = s.objects.length;
  status.textContent = `${count} object${count === 1 ? '' : 's'}${s.range != null ? ` // ${s.range.toFixed(1)} m ahead` : ''}${s.head ? ' // AirPods' : ''}`;
}

const status = document.getElementById('status');

// Same projection as the app's MapFrame: the way you face is up, you sit 68% down, 7 m across.
const mini = document.getElementById('mini'), mctx = mini.getContext('2d'), MINI_M = 7;
function drawMini(s, me, fwd) {
  const dpr = devicePixelRatio || 1, w = mini.clientWidth, h = mini.clientHeight;
  if (mini.width !== Math.round(w * dpr)) { mini.width = Math.round(w * dpr); mini.height = Math.round(h * dpr); }
  const g = mctx, ppm = Math.min(w, h) / MINI_M, ax = w / 2, ay = h * 0.68;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const n = Math.hypot(fwd[0], fwd[2]) || 1, fx = fwd[0] / n, fz = fwd[2] / n;   // right = (-fz, fx)
  const screen = (x, z) => { const dx = x - me[0], dz = z - me[2]; return [ax + (-fz * dx + fx * dz) * ppm, ay - (fx * dx + fz * dz) * ppm]; };
  const poly = (pts, fill) => {
    g.beginPath();
    pts.forEach(([x, z], i) => { const [px, py] = screen(x, z); i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.closePath(); g.fillStyle = fill; g.fill();
  };
  g.setLineDash([4, 4]); g.strokeStyle = 'rgba(255,255,255,.25)'; g.fillStyle = 'rgba(255,255,255,.5)';
  g.font = '10px ui-monospace, Menlo, monospace';
  for (const r of [1, 2]) {
    g.beginPath(); g.arc(ax, ay, r * ppm, 0, 2 * Math.PI); g.stroke();
    g.fillText(`${r} m`, ax + 8, ay - r * ppm + 12);
  }
  g.setLineDash([]);
  for (const c of s.walls ?? []) poly([[c[0], c[1]], [c[2], c[3]], [c[4], c[5]], [c[6], c[7]]], 'rgba(255,149,0,.55)');
  for (const o of s.objects) {
    // Same box the 3D view draws: local x = (cos yaw, -sin yaw), local z = (sin yaw, cos yaw).
    const cy = Math.cos(o.yaw), sy = Math.sin(o.yaw), [hx, hz] = o.half;
    poly([[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) =>
      [o.c[0] + a * hx * cy + b * hz * sy, o.c[1] - a * hx * sy + b * hz * cy]), 'rgba(255,204,0,.55)');
  }
  if (s.range != null) {   // where the beeps say the way ahead is blocked
    g.strokeStyle = '#ff3b30'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(ax - 0.3 * ppm, ay - s.range * ppm); g.lineTo(ax + 0.3 * ppm, ay - s.range * ppm); g.stroke();
    g.lineWidth = 1;
  }
  g.beginPath(); g.moveTo(ax, ay - 22); g.lineTo(ax - 9, ay + 4); g.lineTo(ax + 9, ay + 4); g.closePath();
  g.fillStyle = '#fff'; g.fill();
  g.beginPath(); g.arc(ax, ay, 7, 0, 2 * Math.PI); g.fillStyle = '#0a84ff'; g.fill();
}

// Hold to ask, mirrored: the question as heard, the answer as it streams, and (with Sound on) the same lines
// spoken in the browser's own voice as the phone says them.
const askPanel = document.getElementById('ask'), askState = document.getElementById('ask-state');
const askQ = document.getElementById('ask-q'), askA = document.getElementById('ask-a');
const ASK_LABELS = { listening: 'Listening', transcribing: 'Listening', thinking: 'Thinking', ready: 'Answer' };
let spokenCount = null;   // null until the first snapshot: lines from before the page opened are not replayed
function showAsk(ask) {
  askPanel.hidden = !ask || (!ask.q && !ask.a && !['listening', 'transcribing'].includes(ask.state));
  if (!ask) return;
  askState.textContent = `Ask // ${ASK_LABELS[ask.state] ?? ask.state}`;
  askQ.textContent = ask.q ? `“${ask.q}”` : (ask.state === 'listening' ? 'Listening…' : '');
  askA.textContent = ask.a;
  const fresh = spokenCount == null ? 0 : Math.min(ask.saidCount - spokenCount, ask.said.length);
  spokenCount = ask.saidCount;
  if (audio && fresh > 0) for (const line of ask.said.slice(-fresh)) speechSynthesis.speak(new SpeechSynthesisUtterance(line));
}
async function poll() {
  const started = performance.now();
  try {
    const s = await (await fetch('/state', { signal: AbortSignal.timeout(2000) })).json();
    // AirPods steering: view and sound follow the head (no position of its own: ears above the phone).
    if (s.head) { s.cam = s.head.slice(0, 3); s.fwd = s.head.slice(3); }
    range = s.range ?? null;
    showAsk(s.ask);
    if (s.cam) drawMini(s, s.cam, s.fwd);
    apply(s);
  } catch {
    range = null;   // never beep from a stale reading
    status.textContent = 'Signal lost. Keep SoundGuide open and on the same Wi-Fi.';
  }
  // Count the round trip (~80-180 ms over Tailscale) into the period, so it really is ~10 Hz. One request at a time.
  setTimeout(poll, Math.max(0, POLL_MS - (performance.now() - started)));
}
document.fonts.load('34px Hacked').catch(() => {}).finally(poll);   // name plates are drawn to a canvas once, so wait for the font

const clock = new THREE.Clock(), before = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  // Frame-rate independent exponential easing; a background tab's long frame just snaps.
  const dt = Math.min(clock.getDelta(), 1), k = 1 - Math.exp(-dt / SMOOTH_S);
  if (started) {
    before.copy(phone.position);
    phone.position.lerp(goalPos, k);
    phone.quaternion.slerp(goalQuat, k);
    const p = phone.position;
    if (view.value === 'follow') {
      before.subVectors(p, before);
      camera.position.add(before);
      controls.target.add(before);
    } else if (view.value === 'chase' && goalHeading != null) {
      const kt = 1 - Math.exp(-dt / CHASE_TURN_S);
      heading += Math.atan2(Math.sin(goalHeading - heading), Math.cos(goalHeading - heading)) * kt;
      const dx = Math.sin(heading), dz = Math.cos(heading);
      camera.position.set(p.x - dx * CHASE_BACK, p.y + CHASE_UP, p.z - dz * CHASE_BACK);
      controls.target.set(p.x + dx * CHASE_AHEAD, p.y, p.z + dz * CHASE_AHEAD);   // controls.update() aims the camera here
    }
    if (p.distanceTo(lastTrail) > 0.05 && trailCount < MAX_TRAIL) {
      trail.geometry.attributes.position.setXYZ(trailCount++, p.x, p.y, p.z);
      trail.geometry.attributes.position.needsUpdate = true;
      trail.geometry.setDrawRange(0, trailCount);
      lastTrail.copy(p);
    }
  }
  for (const b of boxes.values()) {
    const kb = b.fresh ? 1 : k;   // a new box appears in place instead of flying in from the origin
    b.fresh = false;
    b.box.position.lerp(b.pos, kb);
    b.box.scale.lerp(b.scale, kb);
    // Shortest way round, so a yaw crossing ±π doesn't spin the box a full turn.
    b.box.rotation.y += Math.atan2(Math.sin(b.yaw - b.box.rotation.y), Math.cos(b.yaw - b.box.rotation.y)) * kb;
    const top = b.box.position.y + b.box.scale.y / 2;
    b.leader.position.set(b.box.position.x, top, b.box.position.z);
    b.tag.position.set(b.box.position.x, top + 0.25, b.box.position.z);
    let goal = 1;
    if (view.value === 'chase' && goalHeading != null) {
      const dx = b.box.position.x - phone.position.x, dz = b.box.position.z - phone.position.z, d = Math.hypot(dx, dz);
      const off = Math.abs(Math.atan2(Math.sin(Math.atan2(dx, dz) - goalHeading), Math.cos(Math.atan2(dx, dz) - goalHeading)));
      const halfWidth = Math.atan(Math.hypot(b.box.scale.x, b.box.scale.z) / 2 / Math.max(d, 0.01));   // partly in view counts
      goal = off - halfWidth <= CONE_HALF ? 1 : FADED;
    }
    b.opacity += (goal - b.opacity) * k;
    b.mat.opacity = b.tag.material.opacity = b.opacity;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
