name: SoundGuide
options:
  bundleIdPrefix: com.kevinakk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ZUH7A64BNJ
    CODE_SIGN_STYLE: Automatic
targets:
  SoundGuide:
    type: application
    platform: iOS
    sources: [SoundGuide]
    info:
      path: SoundGuide/Info.plist
      properties:
        CFBundleDisplayName: SoundGuide
        NSCameraUsageDescription: The camera tracks where you are in the room so sounds come from the right place.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinakk.soundguide
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: [SoundGuideTests]
  SoundGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SoundGuideTests]
    dependencies:
      - target: SoundGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
