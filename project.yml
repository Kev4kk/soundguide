name: SoundGuide
options:
  bundleIdPrefix: com.kevinakk
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ZUH7A64BNJ
    CODE_SIGN_STYLE: Automatic
targets:
  SoundGuide:
    type: application
    platform: iOS
    sources: [SoundGuide]
    info:
      path: SoundGuide/Info.plist
      properties:
        CFBundleDisplayName: SoundGuide
        NSLocalNetworkUsageDescription: Lets a browser on the same Wi-Fi show a live 3D view of what the phone detects.
        NSBonjourServices: [_http._tcp]
        NSCameraUsageDescription: The camera tracks where you are in the room so sounds come from the right place.
        NSMotionUsageDescription: AirPods head movement keeps sounds fixed in the room when you turn your head.
        NSMicrophoneUsageDescription: Hold Ask and speak to ask about what's in front of the camera.
        NSSpeechRecognitionUsageDescription: Your question is turned into text on the iPhone, so it can be answered.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinakk.soundguide
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]   # iOS 26+ only; the app still runs on 17
    scheme:
      testTargets: [SoundGuideTests]
  SoundGuideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SoundGuideTests]
    dependencies:
      - target: SoundGuide
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
